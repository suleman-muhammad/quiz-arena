name: QuizArena CI Pipeline

on:
    push:
        branches: [main, "test/*", "features/*", "refactor/*"]
    pull_request:
        branches: [main]
jobs:
    backend-test:
        name: Backend Unit & Integration Tests
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: testPassword
                    MYSQL_DATABASE: quizarena
                ports:  
                  - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Set up JDK 21 (TEmurin)
            uses: actions/setup-java@v4
            with:
                distribution: 'temurin'
                java-version: '21'
                cache: 'gradle'

          - name: Grant Execute Permissiom to Gradlew Wrapper
            run: chmod +x gradlew

          - name: Run All Junit Tests
            run: ./gradlew test
            env:
                SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/quizarena?useUnicode=true&characterEncoding=UTF-8
                SPRING_DATASOURCE_USERNAME: root
                SPRING_DATASOURCE_PASSWORD: testPassword
                SPRING_JPA_HIBERNATE-DDL_AUTO: update
          
          - name: Upload Test Report Artifact
            if: always()
            uses: actions/upload-artifact@v4
            with:
                name: Junit-test-reports
                path: build/reports/tests/test/
            
    frontend-test:
        name: Frontend Assets Build Check
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4
        
          - name: Set up Node.js 20
            uses: actions/setup-node@v4
            with:
                node-version: 20
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json
          
          - name: Install Frontend Dependencies
            run: npm ci  

          - name: Verify Frontend Builds Cleanly
            run: npm run build
            


        
                 
