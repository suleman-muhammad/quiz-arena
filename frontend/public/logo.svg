<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0A0E1A" />
    </linearGradient>
    <linearGradient id="qGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background Squircle Tile -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="2" />

  <!-- Q Ring Body -->
  <circle cx="48" cy="46" r="26" fill="none" stroke="url(#qGold)" stroke-width="11" stroke-linecap="round" />

  <!-- Inner Arena Core -->
  <circle cx="48" cy="46" r="14" fill="#0A0E1A" />

  <!-- Electric Speed Lightning Bolt Tail for Q -->
  <polygon points="52,48 76,28 64,52 84,48 56,84 62,60" fill="url(#boltGrad)" stroke="#111827" stroke-width="2" stroke-linejoin="round" />

  <!-- Subtle Accent Dot -->
  <circle cx="28" cy="30" r="3" fill="#38BDF8" />
</svg>

